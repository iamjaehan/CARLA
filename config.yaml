# CARLA server connection
# Remote: ssh ji5332@ase-a71908.ece.utexas.edu, run CarlaUE4.sh in ~/Documents/carla
server:
  host: "127.0.0.1"
  port: 2000
  timeout: 10.0        # seconds

# Map to load (null = use whatever the server already has loaded)
map: null

# Vehicle blueprint. by_agent overrides fall back to these defaults.
# hospital_trajectory.csv mapping (2026-09-21): agent 1 = high priority
# (ambulance), 4 = low priority (cargo truck), 2/3 = medium (tesla, default).
vehicle:
  blueprint: "vehicle.tesla.model3"
  color: null            # null = blueprint default (tesla assigns randomly)
  z_offset: 0.3         # spawn height, avoids ground clipping (m)
  by_agent:
    "1":
      blueprint: "vehicle.ford.ambulance"
      color: "231,231,231"   # only recommended color for this blueprint
    "4":
      blueprint: "vehicle.carlamotors.carlacola"
      color: "255,68,0"      # recommended color for this blueprint

# Assumes Julia uses a right-handed frame (x=forward, y=left, yaw=CCW, rad).
# CARLA is left-handed (x=forward, y=right, yaw=CW, deg), so flip by default.
coordinate_transform:
  flip_y: true
  negate_yaw: true
  scale: 8.0              # uniform scale on x/y/z, not yaw; override with --scale
  center_on_offset: true  # recenter trajectory's bbox center onto origin_offset
  # Map location for that center. Set to junction 189's center in
  # Town10HD_Opt; adjust for other maps/scenarios.
  origin_offset:
    x: -47.8
    y: 20.4

# Playback
playback:
  speed_factor: 1.0     # 1.0 = real time, 2.0 = 2x speed
  interpolate_hz: 60.0   # resample onto a uniform grid at this rate; 0 disables (see interpolate.py)
  # true: spectator snaps to a top-down view centered on all agents every
  # frame (jitters as the centroid shifts). false: leave spectator alone.
  follow_camera: false
  show_speed_label: true
  # Spectator transform applied once at start, regardless of follow_camera.
  # Captured from CARLA while framing the hospital scenario (2026-09-21):
  #   python3 -c "import carla; c=carla.Client('127.0.0.1',2000); c.set_timeout(10.0); \
  #   t=c.get_world().get_spectator().get_transform(); print(t)"
  default_camera:
    x: -48.435722
    y: 19.877296
    z: 53.918205
    pitch: -90.0
    yaw: 0.0
    roll: 0.0
